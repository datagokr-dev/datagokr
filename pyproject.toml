[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datagokr-mcp"
version = "0.1.0"
description = "Korean public data search and local access tools"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
authors = [{name = "twmoon"}]
dependencies = ["requests>=2.31", "fastmcp>=3.4.7,<4", "openpyxl>=3.1"]

[project.urls]
Homepage = "https://github.com/twlaude/datagokr"

[project.scripts]
datagokr = "datagokr.cli:main"
datagokr-mcp = "datagokr.mcp:main"

[project.optional-dependencies]
browser = ["browser-cookie3"]
dev = ["pytest", "responses"]

[tool.setuptools.packages.find]
include = ["datagokr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
